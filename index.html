<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HANKEYRZL | Premium Game Store</title>
<meta name="description" content="HANKEYRZL - Katalog akun Free Fire dan Mobile Legends.">
<style>
:root{--bg:#090710;--panel:#191126;--purple:#b35bff;--line:#62338b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#361356,transparent 50%),var(--bg);color:#f9f3ff;font:15px Arial,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,#872ad01c,transparent 40%);animation:glow 9s ease-in-out infinite alternate}header{position:relative;display:flex;justify-content:space-between;align-items:center;padding:20px 5%;border-bottom:1px solid var(--line);background:#130c1dcc}header strong{color:#e0b8ff;letter-spacing:2px;font-size:22px;text-shadow:0 0 18 }

    const info = document.createElement('div');
    info.className = 'info';

    const status = document.createElement('div');

    status.className = 'status' + (p.sold ? ' sold' : '');
    status.textContent = p.sold
      ? '🔴 SOLD OUT'
      : '🟢 TERSEDIA';

    const name = document.createElement('h3');
    name.textContent = p.name;

    const price = document.createElement('div');
    price.className = 'price';
    price.textContent = p.price;

    const btn = document.createElement('button');
    btn.className = 'open';
    btn.textContent = 'LIHAT DETAIL';

    info.append(status, name, price, btn);
    card.append(thumb, info);

    card.onclick = () => show(p);

    card.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        show(p);
      }
    };

    $('grid').append(card);
  }
}

function show(p) {
  current = p;
  photos = images(p);
  photoIndex = 0;

  $('detailName').textContent = p.name;
  $('detailCat').textContent = p.cat;

  $('detailStatus').textContent = p.sold
    ? '🔴 SOLD OUT'
    : '🟢 TERSEDIA';

  $('detailStatus').className =
    'status' + (p.sold ? ' sold' : '');

  $('spec').textContent =
    p.spec || 'Belum ada spesifikasi.';

  $('desc').textContent =
    p.description || 'Belum ada deskripsi.';

  $('detailPrice').textContent = p.price;

  $('buy').textContent = p.sold
    ? 'SOLD OUT'
    : 'BELI VIA WHATSAPP';

  $('buy').classList.toggle('disabled', !!p.sold);

  $('buy').href = p.sold
    ? '#'
    : 'https://wa.me/' + WA +
      '?text=' +
      encodeURIComponent(
        'Halo admin HANKEYRZL, saya ingin membeli ' +
        p.name + ' (' + p.price + ').'
      );

  updatePhoto();

  $('overlay').classList.remove('hidden');
  document.body.classList.add('modal-open');

  $('close').focus();
}

function updatePhoto() {
  $('gallery').classList.toggle('hidden', !photos.length);

  $('count').textContent = photos.length
    ? `${photoIndex + 1} / ${photos.length} • Geser foto untuk melihat lainnya`
    : 'Belum ada foto';

  if (photos.length) {
    $('galleryImage').src = photos[photoIndex];
  }

  $('prev').classList.toggle('hidden', photos.length < 2);
  $('next').classList.toggle('hidden', photos.length < 2);
}

function step(n) {
  if (photos.length) {
    photoIndex =
      (photoIndex + n + photos.length) % photos.length;

    updatePhoto();
  }
}

$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);

let touchX = 0;

$('gallery').addEventListener(
  'touchstart',
  e => {
    touchX = e.changedTouches[0].clientX;
  },
  { passive: true }
);

$('gallery').addEventListener(
  'touchend',
  e => {
    const dx = e.changedTouches[0].clientX - touchX;

    if (Math.abs(dx) > 35) {
      step(dx < 0 ? 1 : -1);
    }
  },
  { passive: true }
);

function close() {
  $('overlay').classList.add('hidden');
  document.body.classList.remove('modal-open');
}

$('close').onclick = close;

$('overlay').onclick = e => {
  if (e.target === $('overlay')) {
    close();
  }
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    close();
  }

  if (!$('overlay').classList.contains('hidden')) {
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  }
});

$('search').oninput = render;

document.querySelectorAll('[data-cat]').forEach(b => {
  b.onclick = () => {
    category = b.dataset.cat;

    document.querySelectorAll('[data-cat]').forEach(x => {
      x.classList.toggle('active', x === b);
    });

    render();
  };
});

onSnapshot(
  collection(db, 'products'),

  snap => {
    products = snap.docs
      .map(d => ({
        id: d.id,
        ...d.data()
      }))
      .sort(
        (a, b) =>
          (b.createdAt?.seconds || 0) -
          (a.createdAt?.seconds || 0)
      );

    render();
  },

  err => {
    $('msg').textContent =
      'Gagal memuat produk: ' + err.message;

    console.error(err);
  }
);
</script>

</body>
  </html>
