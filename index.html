<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HANKEYRZL | Premium Game Store</title>
<meta name="description" content="HANKEYRZL - Katalog akun Free Fire dan Mobile Legends.">

<style>
:root {
  --bg: #090710;
  --panel: #191126;
  --purple: #b35bff;
  --line: #62338b;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: radial-gradient(ellipse at 80% 0%, #361356, transparent 50%), var(--bg);
  color: #f9f3ff;
  font: 15px Arial, sans-serif;
  min-height: 100vh;
}

body:before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 20% 30%, #872ad01c, transparent 40%);
  animation: glow 9s ease-in-out infinite alternate;
}

header {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 5%;
  border-bottom: 1px solid var(--line);
  background: #130c1dcc;
}

header strong {
  color: #e0b8ff;
  letter-spacing: 2px;
  font-size: 22px;
  text-shadow: 0 0 18px #9b4aff99;
}

a {
  color: inherit;
}

header a {
  border: 1px solid var(--line);
  border-radius: 10px;
  text-decoration: none;
  padding: 10px 14px;
}

.wrap {
  max-width: 1100px;
  margin: auto;
  padding: 20px 15px;
}

.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  text-align: center;
  padding: 65px 15px;
  margin: 10px 0 30px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: linear-gradient(135deg, #220e3b, #100b18);
  box-shadow: 0 20px 45px #0007;
}

.hero:before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -100%;
  background: conic-gradient(transparent 55%, #9b42f72c 75%, transparent 90%);
  animation: spin 17s linear infinite;
}

.hero small {
  letter-spacing: 3px;
  color: #c99af7;
}

.hero h1 {
  font-size: clamp(35px, 9vw, 72px);
  margin: 18px 0;
  color: #e7c9ff;
  text-shadow: 0 0 35px #a855f7aa;
}

.hero h1 span {
  color: var(--purple);
}

.hero p {
  color: #d5c1e7;
}

.hero a,
.buy {
  display: inline-block;
  text-decoration: none;
  background: linear-gradient(115deg, #7823bf, #b253f7);
  border-radius: 10px;
  padding: 13px 22px;
  margin-top: 14px;
  font-weight: bold;
  box-shadow: 0 0 22px #a855f74b;
}

.search {
  width: 100%;
  padding: 14px;
  background: var(--panel);
  color: white;
  border: 1px solid var(--line);
  border-radius: 11px;
  font: inherit;
}

.categories {
  display: flex;
  gap: 10px;
  margin: 22px 0;
}

.categories button {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #21152e;
  color: white;
  padding: 13px 8px;
  cursor: pointer;
}

.categories button.active {
  background: #7932c2;
  box-shadow: 0 0 20px #a855f75c;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

@media (min-width: 760px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.card {
  border: 1px solid #4c2b69;
  background: var(--panel);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  animation: rise .45s both;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px #ad52ff35;
}

.thumb {
  height: 155px;
  background: linear-gradient(130deg, #4d2081, #181020);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  overflow: hidden;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.info {
  padding: 13px;
}

.info h3 {
  font-size: 15px;
  min-height: 38px;
}

.price {
  font-size: 18px;
  font-weight: bold;
  color: #d5a0ff;
}

.status {
  font-size: 11px;
  color: #a5f6b3;
}

.status.sold {
  color: #ff9999;
}

.open {
  width: 100%;
  padding: 10px;
  border: 0;
  border-radius: 8px;
  background: #8137c5;
  color: white;
  font-weight: bold;
  margin-top: 12px;
  cursor: pointer;
}

footer {
  text-align: center;
  color: #9d88ad;
  padding: 35px;
}

#msg {
  color: #e7baff;
}

.hidden {
  display: none !important;
}

.overlay {
  position: fixed;
  inset: 0;
  background: #000d;
  z-index: 20;
  overflow: auto;
  padding: 18px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.detail {
  position: relative;
  width: min(100%, 680px);
  margin: 15px auto;
  background: #160e21;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 0 50px #9b3af72a;
}

.close {
  position: absolute;
  right: 14px;
  top: 12px;
  background: #3d2256;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 9px 13px;
  cursor: pointer;
}

.gallery {
  position: relative;
  margin-top: 43px;
  background: #08060e;
  border-radius: 12px;
  overflow: hidden;
}

/* PERUBAHAN UTAMA:
   Foto memenuhi seluruh area galeri. */
.gallery img {
  display: block;
  width: 100%;
  height: 320px;
  object-fit: cover;
  object-position: center;
}

.gallery button {
  position: absolute;
  top: 45%;
  background: #2b153de6;
  border: 1px solid #8c4ac0;
  color: white;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  font-size: 20px;
}

.prev {
  left: 10px;
}

.next {
  right: 10px;
}

.count {
  text-align: center;
  color: #c8a6dc;
  font-size: 12px;
  margin: 10px;
}

.detail h2 {
  margin: 20px 0 6px;
}

.section {
  border: 1px solid #553071;
  border-radius: 12px;
  padding: 15px;
  margin: 18px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.section h3 {
  margin: 0 0 10px;
}

.detail .buy {
  display: block;
  text-align: center;
}

.buy.disabled {
  pointer-events: none;
  background: #51425e;
}

.hint {
  font-size: 12px;
  color: #b9a1c9;
}

body.modal-open {
  overflow: hidden;
}

@keyframes glow {
  to {
    opacity: .4;
    transform: translate(2%, 2%);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *:before,
  *:after {
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<header>
  <strong>HANKEYRZL</strong>
  <a href="admin.html">ADMIN ✦</a>
</header>

<main class="wrap">

  <section class="hero">
    <small>✦ WELCOME TO THE DARK SIDE ✦</small>
    <h1>HANKEY<span>RZL</span></h1>
    <p>Premium Game Store • Free Fire & Mobile Legends</p>
    <a href="#produk">JELAJAHI PRODUK ↓</a>
  </section>

  <input
    class="search"
    id="search"
    placeholder="🔎 Cari produk game..."
  >

  <div class="categories">
    <button class="active" data-cat="Free Fire">🔥 Free Fire</button>
    <button data-cat="Mobile Legends">⚔️ Mobile Legends</button>
  </div>

  <h2 id="produk">Produk Game</h2>
  <p id="msg">Memuat produk...</p>
  <div id="grid" class="grid"></div>

</main>

<footer>© 2026 HANKEYRZL • Game Store</footer>

<div
  class="overlay hidden"
  id="overlay"
  role="dialog"
  aria-modal="true"
  aria-label="Detail produk"
>
  <div class="detail">

    <button class="close" id="close" aria-label="Tutup">✕</button>

    <div class="gallery" id="gallery">
      <img id="galleryImage" alt="Foto produk">

      <button class="prev" id="prev" aria-label="Foto sebelumnya">
        ‹
      </button>

      <button class="next" id="next" aria-label="Foto berikutnya">
        ›
      </button>
    </div>

    <div class="count" id="count"></div>

    <h2 id="detailName"></h2>
    <div id="detailCat"></div>
    <p class="status" id="detailStatus"></p>

    <div class="section">
      <h3>📋 Spesifikasi Akun</h3>
      <div id="spec"></div>
    </div>

    <div class="section">
      <h3>📝 Deskripsi Akun</h3>
      <div id="desc"></div>
    </div>

    <div class="price" id="detailPrice"></div>

    <a
      class="buy"
      id="buy"
      target="_blank"
      rel="noopener noreferrer"
    >
      BELI VIA WHATSAPP
    </a>

  </div>
</div>

<script type="module">
import {
  initializeApp
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';

import {
  getFirestore,
  collection,
  onSnapshot
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyC-6ulYPIwcpv-Rzx3ukg-TtUEJuHO8Nd0',
  authDomain: 'hankeyrzl.firebaseapp.com',
  projectId: 'hankeyrzl',
  storageBucket: 'hankeyrzl.firebasestorage.app',
  messagingSenderId: '318443685641',
  appId: '1:318443685641:web:2bf888053c64465b79f5d8',
  measurementId: 'G-KQZZT5HJ0Y'
};

const db = getFirestore(initializeApp(firebaseConfig));
const WA = '6283172979427';

const $ = id => document.getElementById(id);

let products = [];
let category = 'Free Fire';
let current = null;
let photos = [];
let photoIndex = 0;

function images(p) {
  return (
    Array.isArray(p.images) && p.images.length
      ? p.images
      : [p.image]
  ).filter(
    x =>
      typeof x === 'string' &&
      /^(data:image\/(jpeg|png|webp);base64,|https:\/\/)/.test(x)
  );
}

function render() {
  const q = $('search').value.toLowerCase();

  $('grid').replaceChildren();

  const matches = products.filter(
    p =>
      p.cat === category &&
      String(p.name || '').toLowerCase().includes(q)
  );

  $('msg').textContent = matches.length
    ? ''
    : 'Belum ada produk pada kategori ini.';

  for (const p of matches) {
    const card = document.createElement('article');

    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', 'Lihat detail ' + p.name);

    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    const pic = images(p)[0];

    if (pic) {
      const img = document.createElement('img');

      img.src = pic;
      img.alt = 'Foto ' + p.name;
      img.loading = 'lazy';

      thumb.append(img);
    } else {
      thumb.textContent = '🎮';
    }

    const info = document.createElement('div');
    info.className = 'info';

    const status = document.createElement('div');

    status.className = 'status' + (p.sold ? ' sold' : '');
    status.textContent = p.sold
      ? '🔴 SOLD OUT'
      : '🟢 TERSEDIA';

    const name = document.createElement('h3');
    name.textContent = p.name;

    const price = document.createElement('div');
    price.className = 'price';
    price.textContent = p.price;

    const btn = document.createElement('button');
    btn.className = 'open';
    btn.textContent = 'LIHAT DETAIL';

    info.append(status, name, price, btn);
    card.append(thumb, info);

    card.onclick = () => show(p);

    card.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        show(p);
      }
    };

    $('grid').append(card);
  }
}

function show(p) {
  current = p;
  photos = images(p);
  photoIndex = 0;

  $('detailName').textContent = p.name;
  $('detailCat').textContent = p.cat;

  $('detailStatus').textContent = p.sold
    ? '🔴 SOLD OUT'
    : '🟢 TERSEDIA';

  $('detailStatus').className =
    'status' + (p.sold ? ' sold' : '');

  $('spec').textContent =
    p.spec || 'Belum ada spesifikasi.';

  $('desc').textContent =
    p.description || 'Belum ada deskripsi.';

  $('detailPrice').textContent = p.price;

  $('buy').textContent = p.sold
    ? 'SOLD OUT'
    : 'BELI VIA WHATSAPP';

  $('buy').classList.toggle('disabled', !!p.sold);

  $('buy').href = p.sold
    ? '#'
    : 'https://wa.me/' + WA +
      '?text=' +
      encodeURIComponent(
        'Halo admin HANKEYRZL, saya ingin membeli ' +
        p.name + ' (' + p.price + ').'
      );

  updatePhoto();

  $('overlay').classList.remove('hidden');
  document.body.classList.add('modal-open');

  $('close').focus();
}

function updatePhoto() {
  $('gallery').classList.toggle('hidden', !photos.length);

  $('count').textContent = photos.length
    ? `${photoIndex + 1} / ${photos.length} • Geser foto untuk melihat lainnya`
    : 'Belum ada foto';

  if (photos.length) {
    $('galleryImage').src = photos[photoIndex];
  }

  $('prev').classList.toggle('hidden', photos.length < 2);
  $('next').classList.toggle('hidden', photos.length < 2);
}

function step(n) {
  if (photos.length) {
    photoIndex =
      (photoIndex + n + photos.length) % photos.length;

    updatePhoto();
  }
}

$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);

let touchX = 0;

$('gallery').addEventListener(
  'touchstart',
  e => {
    touchX = e.changedTouches[0].clientX;
  },
  { passive: true }
);

$('gallery').addEventListener(
  'touchend',
  e => {
    const dx = e.changedTouches[0].clientX - touchX;

    if (Math.abs(dx) > 35) {
      step(dx < 0 ? 1 : -1);
    }
  },
  { passive: true }
);

function close() {
  $('overlay').classList.add('hidden');
  document.body.classList.remove('modal-open');
}

$('close').onclick = close;

$('overlay').onclick = e => {
  if (e.target === $('overlay')) {
    close();
  }
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    close();
  }

  if (!$('overlay').classList.contains('hidden')) {
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  }
});

$('search').oninput = render;

document.querySelectorAll('[data-cat]').forEach(b => {
  b.onclick = () => {
    category = b.dataset.cat;

    document.querySelectorAll('[data-cat]').forEach(x => {
      x.classList.toggle('active', x === b);
    });

    render();
  };
});

onSnapshot(
  collection(db, 'products'),

  snap => {
    products = snap.docs
      .map(d => ({
        id: d.id,
        ...d.data()
      }))
      .sort(
        (a, b) =>
          (b.createdAt?.seconds || 0) -
          (a.createdAt?.seconds || 0)
      );

    render();
  },

  err => {
    $('msg').textContent =
      'Gagal memuat produk: ' + err.message;

    console.error(err);
  }
);
</script>

</body>
  </html>
