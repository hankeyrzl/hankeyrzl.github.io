<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HANKEYRZL | Game Store</title><style>:root{--purple:#a855f7;--bg:#090710;--card:#171124}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f2ff;font:14px Arial,sans-serif}header{padding:18px 5%;background:#110b1d;border-bottom:1px solid #4d2673;display:flex;justify-content:space-between;align-items:center}header b{font-size:24px;letter-spacing:2px;color:#d6a5ff}header a{color:white;text-decoration:none;border:1px solid #a855f7;border-radius:8px;padding:9px 13px}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.hero{padding:32px 20px;text-align:center;background:linear-gradient(135deg,#2c124e,#110b1d);border:1px solid #65349b;border-radius:16px}.hero h1{font-size:29px;margin:0 0 8px}.hero h1 span{color:#c58aff}.hero p{color:#cbb7df;margin:0}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.tools input{flex:1;min-width:180px;background:#1d152a;border:1px solid #5d3c83;border-radius:9px;padding:13px;color:white}.categories{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.categories button{background:#20162e;border:1px solid #533176;color:white;border-radius:9px;padding:11px 14px;white-space:nowrap;cursor:pointer}.categories button.active{background:#7839ba}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}.card{background:var(--card);border:1px solid #40285c;border-radius:12px;overflow:hidden}.thumb{height:135px;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(145deg,#4d2081,#1a1129)}.thumb img{width:100%;height:100%;object-fit:cover}.info{padding:12px}.status{font-size:10px;font-weight:bold;color:#9af0a9}.sold{color:#ff9393}.info h3{font-size:14px;min-height:36px;margin:9px 0}.price{font-size:17px;color:#d7a5ff;font-weight:bold}.buy{display:block;text-align:center;background:#853cc8;color:white;text-decoration:none;border-radius:8px;padding:11px 5px;margin-top:12px;font-size:12px;font-weight:bold}.buy.disabled{background:#41364d;color:#c2b7ca;pointer-events:none}footer{text-align:center;padding:28px;color:#9788a8}</style></head><body><header><b>HANKEYRZL</b><a href="admin.html">ADMIN ✦</a></header><main class="wrap"><section class="hero"><h1>WELCOME TO <span>HANKEYRZL</span></h1><p>Temukan akun game pilihanmu di sini 💜</p></section><div class="tools"><input id="search" placeholder="🔎 Cari produk game..."></div><div class="categories"><button class="active" data-cat="Semua">Semua Produk</button><button data-cat="Free Fire">Free Fire</button><button data-cat="Mobile Legends">Mobile Legends</button><button data-cat="PUBG Mobile">PUBG Mobile</button><button data-cat="Valorant">Valorant</button></div><h2>Produk Game</h2><p id="status">Memuat produk...</p><div class="grid" id="grid"></div></main><footer>© 2026 HANKEYRZL • Game Store</footer><script type="module">

const firebaseConfig = {apiKey:"AIzaSyC-6ulYPIwcpv-Rzx3ukg-TtUEJuHO8Nd0",authDomain:"hankeyrzl.firebaseapp.com",projectId:"hankeyrzl",storageBucket:"hankeyrzl.firebasestorage.app",messagingSenderId:"318443685641",appId:"1:318443685641:web:2bf888053c64465b79f5d8",measurementId:"G-KQZZT5HJ0Y"};
const db=getFirestore(initializeApp(firebaseConfig));const admin='6283172979427';let products=[],category='Semua';const grid=document.getElementById('grid'),status=document.getElementById('status');
function render(){grid.replaceChildren();const q=document.getElementById('search').value.toLowerCase();const filtered=products.filter(p=>(category==='Semua'||p.cat===category)&&String(p.name||'').toLowerCase().includes(q));if(!filtered.length){const p=document.createElement('p');p.textContent='Belum ada produk di kategori ini.';grid.append(p);return;}filtered.forEach(p=>{const card=document.createElement('article');card.className='card';const thumb=document.createElement('div');thumb.className='thumb';if(p.image&&(/^(data:image\/(jpeg|png|webp);base64,|https:\/\/)/).test(p.image)){const img=document.createElement('img');img.src=p.image;img.alt='Foto '+p.name;img.loading='lazy';thumb.append(img);}else thumb.textContent=p.emoji||'🎮';const info=document.createElement('div');info.className='info';const badge=document.createElement('span');badge.className='status'+(p.sold?' sold':'');badge.textContent=p.sold?'🔴 SOLD OUT':'🟢 AVAILABLE';const h=document.createElement('h3');h.textContent=p.name;const price=document.createElement('div');price.className='price';price.textContent=p.price;const buy=document.createElement('a');buy.className='buy'+(p.sold?' disabled':'');buy.textContent=p.sold?'SOLD OUT':'BELI VIA WHATSAPP';buy.href='https://wa.me/'+admin+'?text='+encodeURIComponent('Halo admin HANKEYRZL, saya ingin membeli '+p.name+' ('+p.price+').');buy.target='_blank';buy.rel='noopener noreferrer';info.append(badge,h,price,buy);card.append(thumb,info);grid.append(card);});}
document.getElementById('search').addEventListener('input',render);document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});onSnapshot(collection(db,'products'),snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));status.textContent='';render();},err=>{status.textContent='Gagal memuat produk. Coba muat ulang halaman.';console.error(err);});
